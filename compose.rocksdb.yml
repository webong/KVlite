services:
  rocksdb-test:
    build:
      context: .
      dockerfile: docker/rocksdb-test/Dockerfile
      args:
        ROCKSDB_VERSION: ${ROCKSDB_VERSION:-v10.8.3}
    init: true
    environment:
      CGO_ENABLED: "1"
      GOTOOLCHAIN: local
    command: ["sh", "-c", "go test -tags 'rocksdb,kvlite_rocksdb' . ./capi ./cmd/kvlite ./drivers/rocksdb/... ./extensions/http/... ./extensions/redis/... ./examples/basic"]
